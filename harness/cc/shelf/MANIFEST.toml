# The apps-builder asset shelf — vendoring manifest.
#
# Spec: SPECS/2026-09-06-apps-builder-seat.md §F. Admission bar: "an app is
# worse without it". Every third-party file on the shelf has exactly one
# [[file]] entry here; nothing else third-party may be committed under
# harness/cc/shelf/.
#
# Versions pinned 2026-09-06 from the npm registry. The digests below were
# computed from the tarballs the registry served on that date; fetch.sh
# refuses to write a file whose digest does not match.
#
# House-written files (fonts/fonts.css, store/*, INDEX.md, README.md,
# PONYTAIL-PIN, kenney/README) are NOT listed here — they are ours, git is
# their provenance. The ponytail vendoring is pinned in PONYTAIL-PIN, not
# here, because it is a git checkout rather than a registry tarball.
#
# Format, per entry (fetch.sh parses this file with awk; keep it flat,
# one `key = "value"` per line, values double-quoted):
#   slot                 shelf directory / role in the brief
#   package, version     npm coordinates
#   tarball_url          exact download URL
#   tarball_sha256       sha256 of the .tgz
#   path_in_tarball      member to extract, verbatim
#   shelf_path           where it lands, relative to this file
#   sha256               sha256 of the extracted file
#   license              SPDX id
#   license_in_tarball   the package's own licence text
#   license_shelf_path   where that text lands

