# /etc/disjorn-broker/verbs.toml — THE KILL SWITCHES (HARNESS-PLAN WP-H3).
# TEMPLATE — copied into place by harness/keyboard/04-broker.sh (never
# overwriting an existing file). Owned root:plink 0640; edit with sudoedit.
#
# One section per CALLER, one boolean per verb. The broker re-reads this
# file on EVERY request, so flipping a switch takes effect immediately — no
# broker restart, no window. Anything missing (file, section, or key) means
# OFF: the broker fails closed.
#
# Every caller but one is a resident seat. The exception is [plink] at the
# bottom: the wake caller (SPECS/2026-08-25-agentic-residents.md), which holds
# exactly one verb and which no seat section may ever hold.
#
# EVERY verb ships OFF for EVERY resident. plink flips each one on
# deliberately, one at a time, when he decides that resident gets that power.
#
# There is no `restart-self` line because there is no such verb — residents
# cannot bring themselves back up unsupervised (plink's ruling #3,
# AGENTHOOD.md; enforced by test in harness/broker/tests/).
#
# THIS FILE IS NOW THE VERB SET, and every seat's schema is generated from it
# (SPECS/2026-08-14-file-vision.md item 3). Adding or removing a line here
# means:
#   1. add or remove the matching entry in harness/broker/verb_surface.toml
#      (the caller-facing shape: description, flags, argument schema), then
#   2. run  python3 harness/broker/gen_verb_surface.py write  to rewrite the
#      shell seat's CLI table, and
#      python3 harness/broker/gen_verb_surface.py emit-tools \
#          --out <bot repo>/broker_tools.py
#      for a bot seat's tool schemas.
# harness/broker/tests/test_verb_surface.py fails if the two disagree, in
# EITHER direction — a verb with no surface is a capability nobody can reach,
# and a surface with no verb is a button wired to nothing. Both have happened;
# that is why the check exists.
#
# The generator reads only the KEY NAMES here, never the booleans: whether a
# resident may call a verb is decided at the socket, per request, by the
# broker. If generation followed the switch, flipping one off would delete a
# tool instead of denying a call.

[res-claudette]
"restart-disjorn" = false
"run-server-tests" = false
"refresh-mirror" = false
"start-build" = false
"classify-diff" = false
"read-prod-logs" = false
"read-own-log" = false
"read-metrics" = false
"file-proposal" = false
"query-own-audit" = false
"board-list" = false
"board-card" = false
"board-search" = false
"board-flag" = false
"board-comment" = false
"summon-hop" = false

# NOTE there is no `wake` line in either seat section, and adding one grants
# nothing: the broker refuses `wake` to every resident identity in code, before
# this file is read (_check_wake_identity). A seat that could wake a seat is a
# self-wake, and nothing self-wakes.

[res-gable]
"restart-disjorn" = false
"run-server-tests" = false
"refresh-mirror" = false
"start-build" = false
"classify-diff" = false
"read-prod-logs" = false
"read-own-log" = false
"read-metrics" = false
"file-proposal" = false
"query-own-audit" = false
"board-list" = false
"board-card" = false
"board-search" = false
"board-flag" = false
"board-comment" = false
"summon-hop" = false

# THE WAKE CALLER (SPECS/2026-08-25-agentic-residents.md). plink, at the
# keyboard, from his own uid — the section name is the identity his uid maps to
# in broker.toml [uids], and the broker will not start if that mapping is
# missing. One verb, and the broker refuses this caller every other verb in
# code, so this section can never grow into a second keyboard.
#
# It is NOT a seat section: gen_verb_surface.py reads seat sections only, so
# `wake` never becomes a button in any resident's CLI or tool list. A verb no
# seat may call must also be a verb no seat can see.
[plink]
"wake" = false
