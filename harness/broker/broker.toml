# /etc/disjorn-broker/broker.toml — disjorn-broker daemon configuration.
# TEMPLATE — copied into place by harness/keyboard/04-broker.sh (never
# overwriting an existing file). Owned root:plink 0640; edit with sudoedit.
#
# This file lives OUTSIDE both resident containers on purpose: nothing in it
# is reachable — for reading or writing — from inside a resident's world.
# (HARNESS-PLAN WP-H4 "protected by placement".)

[broker]
# Where the unix socket lives. The systemd unit sets RuntimeDirectory=
# disjorn-broker, which creates /run/disjorn-broker owned by plink — that is
# why the socket sits in a subdirectory rather than directly in /run (a
# non-root daemon cannot create files in /run itself).
# This path gets bind-mounted into each resident container (WP-H1).
socket_path = "/run/disjorn-broker/broker.sock"

# Append-only JSON-lines audit trail: one line per call, allowed or denied.
# /var/log/disjorn-broker is created by the unit's LogsDirectory=.
audit_log = "/var/log/disjorn-broker/audit.jsonl"

# BL-D2: where a detached build's stdout/stderr are spooled (0600 temp files,
# deleted when the build reaches a terminal state; only a 64 KiB tail is ever
# read back into the broker, so a flooding build can no longer balloon the
# broker's RSS). Default when unset: <dir of audit_log>/build-logs, i.e.
# /var/log/disjorn-broker/build-logs — plink-owned, resident-unreachable, and
# on DISK. Do not point this at /tmp on this host: /tmp is tmpfs, so the flood
# would simply move back into RAM.
#
# WP-L4 open fork, two more things live here:
#   * <slug>.build.json — one 0600 sidecar per in-flight build (unit, branch,
#     both spool paths, the ORIGINAL deadline). A build now runs in a transient
#     unit outside this daemon's cgroup, so a broker restart no longer kills it;
#     the sidecar is how the NEXT broker process finds it, re-claims its slug and
#     still posts its done/failed line. Removed on every terminal path, and
#     swept at startup along with any spool file whose build died with its broker.
#   * disk bounding: the build's stdout is a regular file (a spool here), so the
#     unit carries LimitFSIZE (RLIMIT_FSIZE) — a flooding build dies loudly on
#     SIGXFSZ instead of filling /. The ceiling is a constant in the launch
#     helper, deliberately not a config value a caller could widen.
# build_log_dir = "/var/lib/disjorn-broker/build-logs"

[uids]
# Kernel uid -> caller identity. THE authentication table: the broker trusts
# SO_PEERCRED, maps the uid here, and denies anything unlisted.
# Fill in the real uids after harness/keyboard/01-users.sh has run
# (`id -u res-claudette`). Keys must be quoted (TOML).
# "998" = "res-claudette"
# "997" = "res-gable"
# plink's OWN uid, for the wake verb and nothing else (see [wake] below). The
# broker refuses this identity every other verb in code, so listing it here
# widens nothing: it only makes a human at the keyboard nameable at the socket.
# Without this line the wake surface cannot start.
# "1000" = "plink"

[residents.res-claudette]
# The ONLY file read-own-log will serve to res-claudette. No other path is
# ever accepted, whatever the caller sends.
log_path = "/home/res-claudette/logs/disjorn_bot.log"
# OPTIONAL (BL-D1): host directories this resident can WRITE that the broker
# cannot infer from the /home/<resident> convention — e.g. a shared rw volume
# mounted into the container from elsewhere. The start-build guard treats these
# as resident volumes and refuses to start if start_build.specs_dir lands in
# one. Declare any such mount here; the guard's permission walk is a backstop,
# not a substitute (a bind mount can be rw inside the container while the host
# path looks read-only to the res-* uid).
# writable_roots = ["/srv/shared-scratch"]

# PLACEMENT FIXED 2026-07-26: these four keys were BELOW the
# [residents.res-claudette.path_map] header, so TOML parsed them into
# path_map instead of into this table. A fresh install therefore got no
# metrics for her at all (an absent input silently skips its section) AND
# four junk prefixes in the classify-diff allowlist. res-gable's identical
# block was placed correctly, which is why only she was affected.
# WP-H12 metrics producer inputs (all read-only; optional — omit to skip that
# section for this resident). house_memory retrieval log, WP-H5 ~/.action-log
# (all tool calls in the container), WP-H5 budget.json (for cap legibility),
# and the markdown spine dir.
#
# PATHS CORRECTED 2026-07-26 to match the verified live deployment. Everything
# a resident owns lives in the world-readable `resident-home/` volume INSIDE
# the 0700 home, NOT directly under it — this template omitted that segment,
# so a fresh install produced a metrics system that silently read nothing (an
# absent input path just skips its section; there is no error). The live
# /etc/disjorn-broker/broker.toml was fixed 2026-07-22; this template was not,
# which is the "next install regresses" trap flagged in KEYBOARD-NEXT §3.
# The spine dirs are the CANONICAL repos under /home/plink (read-only to the
# host-side producer), not paths inside the resident homes.
retrieval_log = "/home/res-claudette/resident-home/memory/memory_retrieval.jsonl"
action_log = "/home/res-claudette/resident-home/.action-log"
budget_json = "/home/plink/resident-config/res-claudette/budget.json"
spine_dir = "/home/plink/bots/claudette/spine"

[residents.res-claudette.path_map]
# classify-diff path translation AND allowlist: residents pass their
# in-container paths; the broker (host-side) maps prefixes, longest wins;
# anything outside every mapped root is bad-args. This deployment: the
# read-only repo mirror and her home volume.
"/opt/disjorn" = "/srv/disjorn-ro"
"/home/resident" = "/home/res-claudette/resident-home"


[residents.res-gable]
log_path = "/home/res-gable/logs/gable.log"
retrieval_log = "/home/res-gable/resident-home/memory/memory_retrieval.jsonl"
action_log = "/home/res-gable/resident-home/.action-log"
budget_json = "/home/plink/resident-config/res-gable/budget.json"
spine_dir = "/home/plink/bots/fable/spine"

[residents.res-gable.path_map]
# REQUIRED for classify-diff — this is the allowlist, not just translation.
# WP-H13 F2: when a resident has NO path_map, classify-diff falls open and
# accepts ANY absolute host path the broker uid can read. Every resident with
# classify-diff must have a map, even while the verb ships OFF. Gable's
# container view -> host paths, same two roots as his run-resident mounts.
"/opt/disjorn" = "/srv/disjorn-ro"
"/home/resident" = "/home/res-gable/resident-home"

[commands]
# Fixed argv lists — the broker NEVER passes a string to a shell. Validated
# scalar arguments (line counts, git ranges) are appended by the handlers as
# separate argv items; callers cannot inject flags or commands.
#
# restart-disjorn: `sudo -n` succeeds only because of the single line in
# /etc/sudoers.d/90-disjorn-broker (exactly `systemctl restart disjorn`).
restart_disjorn = ["sudo", "-n", "systemctl", "restart", "disjorn"]

# run-server-tests: the full server pytest suite, run from the server dir.
run_server_tests = ["/home/plink/Disjorn/Disjorn/server/.venv/bin/python", "-m", "pytest", "tests", "-q"]
run_server_tests_cwd = "/home/plink/Disjorn/Disjorn/server"

# read-prod-logs: handler appends ["-n", "<validated count>"].
read_prod_logs = ["journalctl", "-u", "disjorn", "--no-pager", "-o", "short-iso"]

# classify-diff: handler appends --repo/--range/--gates-json (all validated).
classify_diff = ["/home/plink/Disjorn/Disjorn/server/.venv/bin/python", "/home/plink/Disjorn/Disjorn/harness/classifier/classify_diff.py"]

# refresh-mirror: fast-forward the shared read-only mirror (/srv/disjorn-ro,
# the residents' only view of the repo) to the canonical repo's main. The verb
# takes NO caller args — all three argvs are fixed here, so residents can
# refresh the mirror but never aim git anywhere else. --ff-only fails loudly
# if the mirror ever diverges (that stays plink's to resolve).
refresh_mirror_fetch = ["git", "-C", "/srv/disjorn-ro", "fetch", "origin"]
refresh_mirror_update = ["git", "-C", "/srv/disjorn-ro", "merge", "--ff-only", "origin/main"]
refresh_mirror_head = ["git", "-C", "/srv/disjorn-ro", "rev-parse", "--short", "HEAD"]

# FILE VISION (SPECS/2026-08-14-file-vision.md item 1): the same verb also
# fetches every ENTITLED gatehouse repo's branches into the mirror, under
# refs/gatehouse/<repo>/*. Without this the mirror can tell a resident what
# production runs and cannot show them a single branch they are being asked to
# review — the structural half of the crossing problem in 1226.
#
# TWO SOURCES, DELIBERATELY (plink, 2026-08-15). `main` comes from origin
# (plink's working clone = deploy truth); BRANCHES come from the gatehouse.
# Single-sourcing everything on the gatehouse would make mirror-main LEAD
# production — the merged-is-not-deployed gap inverted, in the direction nobody
# watches.
#
# THIS LIST IS THE ENTITLEMENT. It is not a glob of the gatehouse directory,
# for the same reason run-build.sh stopped globbing it: a set that grows every
# time the keyboard creates a lane is a widening that arrives by directory
# listing rather than by decision. Name the repos; adding one is a visible diff
# in a plink-owned file. UNSET (either key absent) = today's main-only
# behaviour, so an unmigrated deployment simply keeps working.
#
# The verb still takes NO caller args: the directory and the names are config,
# the refspec is a constant in brokerd.py, and the repo names are re-validated
# against ^[A-Za-z0-9][A-Za-z0-9._-]*$ before they reach an argv.
refresh_mirror_gatehouse_dir = "/var/lib/disjorn-broker/gatehouse"
refresh_mirror_gatehouse_repos = ["disjorn", "claudette", "gable"]
# --prune is the load-bearing flag: a branch that vanished from the gatehouse
# vanishes from the mirror too, so nobody reviews a ref that was harvested into
# main last week. The verb's summary NAMES what vanished and says "harvested or
# deleted" — it does not guess which, because from here it cannot tell.
refresh_mirror_gatehouse_fetch = ["git", "-C", "/srv/disjorn-ro", "fetch", "--prune"]

[paths]
# read-metrics serves exactly this file. The WP-H12 producer
# (harness/metrics/metrics.py `build`) writes it; run it on a timer. Until it
# has run once, an empty {} JSON file is fine.
metrics_json = "/var/lib/disjorn-broker/metrics.json"
# classify-diff hands this to the classifier as --config. Protected by
# placement: install the repo's harness/classifier/protected-paths.toml to
# /etc/disjorn-broker/ (root:plink 0640, resident-unreachable) and point here.
protected_paths = "/etc/disjorn-broker/protected-paths.toml"

[gate]
# KEYBOARD-LANE GATE (Plan Room Phase 0) — what the DAILY DIGEST needs to read
# in order to report on the pre-receive hook. The hook itself reads NONE of
# this: it is a git hook, it takes its git-dir from git, and it must keep
# working whether or not this file is even present. This block only arms the
# DETECTOR (harness/metrics/metrics.py, the GATE DRIFT block).
#
# WITH THIS BLOCK ABSENT the digest still posts a drift block, and that block
# says DETECTOR NOT CONFIGURED. That is deliberate: an empty drift block and a
# disarmed detector must never read alike (seq 1428, G3). Install is hand-made,
# and committed-isn't-installed went four-for-four on 08-19/20.

# The canonical repo the hook is installed on. `hook_link` and `push_log`
# default to <canonical_repo>/hooks/pre-receive and
# <canonical_repo>/hooks/disjorn-push-log — set them only if you moved either
# (and if you set DISJORN_PUSH_LOG for the hook, you MUST set push_log here to
# match, or the detector goes blind; it will say so on its liveness line).
canonical_repo = "/var/lib/disjorn-broker/gatehouse/disjorn.git"
# hook_link = "/var/lib/disjorn-broker/gatehouse/disjorn.git/hooks/pre-receive"
# push_log  = "/var/lib/disjorn-broker/gatehouse/disjorn.git/hooks/disjorn-push-log"

# The read-only mirror, same one `refresh-mirror` maintains and board.py reads.
# Commit history, the override count, and the committed sha of
# harness/gatehouse/hooks/pre-receive-main-review all come from here.
mirror = "/srv/disjorn-ro"
# mirror_branch = "main"    # default

# Prod's running tree — the deploy-drift half. Since prod deploys from the
# mirror the hook already sits on the deploy path, so this line is
# belt-and-braces, except for the one thing nothing else catches: a DIRTY
# working tree here is code that is running and was never published.
deploy_tree = "/home/plink/Disjorn/Disjorn"

# The message store, for resolving cited seqs (G2: the seq must exist and live
# in #custodian) and for reading the digest's own previous post back — that
# post is where the floor-motion baseline lives, outside the git-dir, which is
# why it survives a log delete. Defaults to <deploy_tree>/server/data/disjorn.db.
# message_db = "/home/plink/Disjorn/Disjorn/server/data/disjorn.db"

# [gate.author_aliases]
# Git identities that belong to a #custodian author under another name, for the
# self-cited check. `keyboard = ["plink"]` and `broker = ["disjorn-broker"]` are
# built in; add a line only if a resident's git identity does not contain their
# #custodian name.
# keyboard = ["plink"]

[planroom]
# THE PLAN ROOM (SPECS/2026-08-20-plan-room.md, confirmed seq 1434). The board
# tab, the `board-*` verbs, and the CLI all render one derivation, and this
# block is where that derivation is aimed.
#
# `index` is the DERIVED CARD CACHE this daemon writes and the Disjorn server
# reads. It is a CACHE, NEVER A SOURCE: git wins every disagreement and the
# index rebuilds from zero. Delete the file and the next rebuild restores it
# whole; there is no path by which it teaches git anything. Point the server's
# PLANROOM_INDEX at the same file (read-only) — derivation needs gatehouse
# access and brokerd imports, and the server process has neither and must not
# grow them (seq 1428 P2).
#
# WITH THIS BLOCK ABSENT nothing rebuilds and the board verbs still answer:
# they ask the server, which says the index is unavailable and why. An absent
# index and an empty board must not read alike.
index = "/var/lib/disjorn-broker/planroom-index.db"

# When to rebuild (seq 1428 P4 — a trigger nobody has to remember).
rebuild_on_refresh = true   # after `refresh-mirror` moves the mirror
timer_sec = 900             # the daemon's own tick; 0 disables it
# Post ONE #custodian line per COLUMN TRANSITION, never per edit. A rebuild
# that moved nothing says nothing, and a cold start (no prior index) announces
# nothing at all.
announce = true

# Review owner for a card that has no spec file — an uncited `main` commit —
# by path prefix, first match wins. THERE IS NO DEFAULT MAP IN THE CODE, on
# purpose: a lane -> owner table is house policy, ruled in #custodian, and a
# guess compiled into a harness module is exactly the hand-written layer the
# Plan Room exists to delete. An unmapped path reads `unassigned`, which is
# true.
[planroom.lane_owners]
"server/" = "Claudette"
"client/" = "Claudette"

[budgets]
# WP-H12 daily per-resident action budget on broker verbs. DEFAULT OFF:
# with nothing set here the broker never denies on budget. Instrument first
# (every call is audited; read the real counts in #custodian), THEN set a cap.
# A cap change needs a broker restart (kill switches in verbs.toml stay live).
#
# default_daily_action_cap = 2000        # applies to any resident without an override
# [budgets.res-claudette]
# daily_action_cap = 2000
# [budgets.res-gable]
# daily_action_cap = 2000

[summon_hops]
# The bot-to-bot summon wall (SPECS/2026-08-24-custodian-mention-summons.md).
# COMMENTED OUT = no wall: summon-hop answers "no bucket" to everything, which
# is rule 1 (a bot-triggered summon's reply cannot re-trigger anyone) and is
# exactly the behaviour that shipped with WP-H9. Uncomment to allow work loops.
#
# state_path is MANDATORY once this section exists and the broker refuses to
# start without it: a counter that cannot persist would unpark every parked
# chain on every restart. Use the daemon's StateDirectory, not /run.
#
# state_path = "/var/lib/disjorn-broker/summon-hops.json"
# hop_cap = 8            # ~4 review/fix round-trips (the 08-21 churn ceiling).
#                        # At the cap the work item PARKS FOR A HUMAN: further
#                        # bot-to-bot hops on it are refused until a human posts
#                        # in #custodian about it. Midnight does NOT unpark it.
# daily_hop_cap = 24     # hops per work item per UTC day, RESETS INCLUDED — so
#                        # repeated human nudges cannot compound into an all-day
#                        # burn. This one does roll over at 00:00 UTC.

[start_build]
# WP-L4 start-build: launch a DETACHED build of a CONFIRMED spec to a
# `loop/<slug>` branch. Like the WP-H9 summon launcher, argv is ENTIRELY
# config-derived — [*command, resident, slug, *session_argv, "--model", model]
# — and the spec (the chat-derived design) is fed on STDIN, never spliced into
# argv. The verb ships OFF in verbs.toml; this section is inert until flipped.
#
# HOW THE BUILD IS LAUNCHED (WP-L4 open fork, KEYBOARD-NEXT 6b).
#
# NOT run-build.sh directly. The broker runs as plink, so a build launched
# straight from it ran podman as PLINK: `--userns keep-id` mapped the container
# to uid 1000 (so a callback to this socket presented plink in SO_PEERCRED),
# `$HOME/resident-home` resolved to /home/plink/resident-home, a
# resident-authored spec drove a session with plink's filesystem access, and the
# session sat in the broker's cgroup so any broker restart killed it.
#
# Instead the launch goes through ONE validating root helper
# (harness/broker/disjorn-build-launch), which execs:
#     systemd-run --unit=disjorn-build-<slug> --uid=res-<resident> --pipe
#                 --collect <fixed limits> -- <run-build.sh> <resident> <slug> …
# so the build is a TRANSIENT SYSTEM SERVICE under the resident's own uid:
# correct identity by construction, outside this daemon's cgroup (survives a
# broker restart — see the sidecar/re-adoption note under build_log_dir), and
# with kernel-enforced memory/disk/wall-clock ceilings.
#
# `sudo -n` succeeds only because of /etc/sudoers.d/91-disjorn-build, which
# names that ONE helper in exactly two shapes (run/stop) with regex-constrained
# arguments — never systemd-run, which cannot be granted safely (any wildcard in
# a sudoers rule for it is equivalent to a grant of full root; the file explains
# why at length). Install the helper root:root 0755 FIRST or every launch fails
# closed. The trailing "run" is the helper's subcommand; the broker appends
# <resident> <slug> <session_argv…> after it, exactly as run-build.sh expects.
command = ["sudo", "-n", "/usr/local/lib/disjorn/disjorn-build-launch", "run"]
# How the reaper KILLS a build at the cap. The unit lives outside the broker's
# cgroup, so killing the local sudo/systemd-run process no longer kills the
# build: the cap only bites because of this. Same helper, second fixed shape;
# the broker appends <resident> <slug>.
stop_command = ["sudo", "-n", "/usr/local/lib/disjorn/disjorn-build-launch", "stop"]
# How a build's unit is POLLED (unprivileged — no sudo, read-only). Used when
# re-adopting a build that outlived a broker restart; the broker appends the
# unit name. A unit systemd has forgotten answers "inactive", which is terminal.
unit_state_command = ["systemctl", "show", "--property=ActiveState", "--value"]
# WHICH resident the build runs AS — this is now a kernel identity (res-<name>),
# not a label. It must have a line in /etc/sudoers.d/91-disjorn-build; adding a
# build resident is a keyboard act with a visible diff, on purpose.
# resident = — REMOVED (BR-1, 2026-08-14). The build runs as the resident
# whose SO_PEERCRED called start-build; a configured identity was how every
# build ran as res-gable whoever pressed, and how a missing credential in
# Claudette's build seat stayed invisible for a week.
# The command run INSIDE the container: a headless Claude Code build session.
# The trailing "$@" + the "build-session" argv0 are load-bearing (WP-L5): the
# broker appends `--model <id>` after this list, and `bash -lc "<script>"
# build-session --model <id>` makes those the script's positional args, which
# "$@" forwards to claude. Drop either and the pin stops reaching claude.
session_argv = ["bash", "-lc", "exec claude -p --output-format json \"$@\"", "build-session"]
# WP-L5 MODEL PIN — no fallback. A blank/absent pin is config drift and the
# verb refuses (never rides the account default). ONE-PIN UPGRADE PATH: flip
# this one value when Fable API access returns on plink's credits.
model = "claude-opus-4-8"
# The authoritative committed specs the confirm gate reads: the read-only repo
# mirror's SPECS/ (refreshed by refresh-mirror). A spec must resolve DIRECTLY
# inside this dir — no `..`, no symlink escape — and be status `confirmed` with
# a filled confirm record, or the build is refused.
#
# BL-D1 — THIS LINE IS THE AUTHORIZATION, NOT A PATH PREFERENCE. The confirm
# record is a presence check on text; it only means anything because residents
# cannot write this directory. Point it at anything a resident can write (a
# resident home, a shared rw volume, a world-writable dir) and any resident can
# forge "Confirmed by: plink" and self-authorize builds. The broker therefore
# VERIFIES this at startup — resident volumes by path, plus a stat() of the
# directory and every parent up to / — and REFUSES TO START if it cannot prove
# the directory is resident-unwritable. There is no override flag. Keep it on
# the RO mirror; if you must move it, move it somewhere plink owns and
# residents never mount.
specs_dir = "/srv/disjorn-ro/SPECS"
# The CANONICAL repo whose SPECS/ that mirror follows. Since 2026-08-17 the
# broker moves a spec's `## Status` line as its build moves — `confirmed` ->
# `building` at start-build, then `built@<branch>` / `failed` (or `confirmed`
# again for a build that produced nothing) with the terminal banner — as
# plumbing commits on this repo's `main` (never touching the keyboard's index
# or working tree unless the file is provably clean), each followed by the same
# fetch + --ff-only refresh `refresh-mirror` runs, so residents and the confirm
# gate read the word at once. Unset = stamping off, warned at startup, and every
# build banner says "spec status: NOT updated" — a spec under construction then
# keeps reading `confirmed` and the board lists it as buildable, which is the
# 2026-08-17 confusion this exists to end. `board --mark-merged` writes the last
# word (`merged`); the broker never sees a merge.
spec_repo = "/home/plink/Disjorn/Disjorn"
# spec_repo_branch = "main"    # default
# spec_repo_subdir = "SPECS"   # default
# Wall-clock cap for the detached build (seconds). Longer than the 300s summon
# — a build is a whole feature, not a chat turn. The reaper kills at the cap
# and narrates a loud failure.
timeout_sec = 3600
# Per-day build budget. RULED 10 by plink 2026-08-05 (#custodian). Previously
# 2 — a PROPOSAL that BUILD-LOOP.md flagged as "plink tunes at staging time"
# and that hardened into "the ratified default" in two docs without anyone
# ratifying it. CAPPED by default,
# unlike the action budget above. Race-safe (count-with-reservation, H13-D4).
daily_build_cap = 10
# Optional per-resident override:
# [start_build.per_resident.res-gable]
# daily_build_cap = 2

[wake]
# AGENTIC RESIDENTS v1 (SPECS/2026-08-25-agentic-residents.md, confirmed seq
# 1913). plink wakes a seat with a task; the seat works it in one headless
# session and posts the result to #custodian. Nothing self-wakes: there is no
# cron here, no anomaly trigger, and no chat surface — those are later specs.
#
# COMMENTED OUT = no wake surface. The verb exists and refuses every caller
# (audited), which is the same fail-closed shape as an unflipped kill switch.
#
# WHAT THIS SECTION IS. The broker's whole part in a wake is authentication and
# a record: it resolves the caller from SO_PEERCRED, checks the seat against
# `residents` below, and drops one 0644 JSON record in `spool_dir`. It launches
# nothing. The session runs in the seat's own container, under the seat's own
# uid, started and harvested by that seat's wake runner
# (harness/residency/run_wake.py) — which is also the only thing that posts.
#
# callers = who may wake. A name here must have a uid in [uids] (a caller that
# cannot be authenticated would read as a grant while refusing every call) and
# must NOT be a res-* seat (that would be a self-wake in one config line). The
# broker refuses to start on either, and refuses this identity every verb but
# `wake` at the socket. Flipping [plink] "wake" = true in verbs.toml is the
# live kill switch on top.
# callers = ["plink"]
# residents = who may BE woken. Caller input is checked against this list, so a
# wake can only ever reach a seat named here.
# residents = ["res-gable"]
# WHERE THE RECORDS LAND. Plink-owned, resident-READABLE, resident-UNWRITABLE —
# verified at startup exactly like start_build.specs_dir, with the same
# refusal-to-start, because it rests on the same kind of authorization: a
# resident that can write this directory can write itself a wake. Do not point
# it at a resident home, a declared writable root, or anything world-writable.
# spool_dir = "/var/lib/disjorn-broker/wake-spool"
# THE SESSION CAPS, and they live HERE rather than in the seat's config so that
# there is ONE value and it is plink's. Both ride on the wake record; the
# runner enforces a cap it cannot widen. Longer than the 600s summon — a wake
# is a work session, not a chat turn — and shorter than the 3600s build cap is
# NOT required; tune from observed wakes.
# session_cap_sec = 5400          # 90 min wall clock for the woken session
# grace_sec = 600                 # harvest + post margin. A wake with a start
#                                 # and no end in the seat's action log after
#                                 # cap+grace is an incident.
# The per-session ACTION cap is not here: a woken session runs on the same
# /config/budget.json the summon seat does (harness/cc/config-template), which
# is the spec's "same per-session action cap" and needs no second knob.

[disjorn]
# file-proposal posts to #custodian AS THE BROKER'S OWN bot identity — the
# proposal text is data; the authority to post is the broker's. Create a
# dedicated bot (e.g. "broker") via server/cli.py and put its API key in
# api_key_path (root:plink 0640).
url = "http://127.0.0.1:8399"
api_key_path = "/etc/disjorn-broker/broker-api-key"
# Channel id of #custodian (look it up in the server DB / channel list).
custodian_channel_id = 4
