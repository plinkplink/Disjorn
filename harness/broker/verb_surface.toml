# harness/broker/verb_surface.toml — THE CALLER-FACING SHAPE of every broker
# verb, in one file, for every seat.
#
# WHY THIS FILE EXISTS (SPECS/2026-08-14-file-vision.md item 3, as upgraded by
# Claudette's cross-lane review). A verb has, today, THREE descriptions of
# itself living in three files maintained by three different hands:
#
#   * verbs.toml            whether a resident may call it       (plink, /etc)
#   * broker-cli/broker     the flags a shell seat can type      (Disjorn repo)
#   * <bot>/core.py         the tool schema a bot seat is given  (bot repo)
#
# and nothing checked them against each other. The result is a drift class,
# not a drift instance — FOUR instances by 2026-08-15:
#   1. `restart_disjorn` sat in a tool list for two weeks while verbs.toml had
#      it false: a button wired to nothing.
#   2. `start-build` was flipped true 2026-08-05 with no tool for it: a
#      capability the resident could not reach. Found only because she said so.
#   3. `refresh-mirror` was true while the resident IMAGE predated the CLI
#      subcommand (KB-D9) — switched back off rather than shipped.
#   4. `refresh-mirror` ON for both residents and absent from the bot tool
#      schema, which is the instance this spec was written about.
#
# So: verbs.toml stays THE verb set (it is plink's, and it is the kill switch),
# this file says what each verb LOOKS LIKE to a caller, and every seat's schema
# is GENERATED from the two by harness/broker/gen_verb_surface.py. Adding a
# verb is one entry here; forgetting one is a test failure, not a fortnight.
#
# THIS FILE GRANTS NOTHING. It is a description of a surface, not an
# authorization: the broker authenticates by SO_PEERCRED and authorizes by
# verbs.toml, and a verb described here that verbs.toml has off is refused with
# verb-disabled exactly as before. Nothing generated from here can widen what
# the broker accepts — the broker re-validates every argument server-side and
# is the only authority. Client-side validation, here as in the CLI it
# replaces, is for a fast readable failure and nothing more.
#
# TWO TABLES SINCE 2026-08-19. [verbs] below is the broker's surface and is
# what the generator reads. [adapter_tools], at the END of this file, is a
# DESCRIPTION of tools a bot seat has from its own adapter code, with no
# broker and no verbs.toml row behind them — it is inert to the generator by
# construction and by test. Its own header says why that inertness is
# load-bearing rather than incidental; read it before adding a row there.
#
# ORDER IS LOAD-BEARING. The entries below are in the order a bot seat
# registers them, and registration order is prompt order. Append new verbs at
# the END; do not reorder existing ones to be tidy.
#
# ARG GRAMMAR (all keys optional unless noted):
#   type            "string" | "integer" | "object"        REQUIRED
#   required        bool, default false
#   flag            the CLI flag; default "--<name with _ as ->"
#   description     REQUIRED — shown to a model and in --help
#   seats           ["cli", "tool"] — which surfaces carry this arg.
#                   Default both. `read-own-log.path` is cli-only: the broker
#                   realpath-pins it to the caller's own log, so it is a
#                   debugging affordance for a shell, not a knob to hand a model.
#   minimum/maximum integer bounds (type = "integer")
#   min_len/max_len string length bounds (type = "string")
#   pattern         anchored regex the string must match
#   absolute_path   bool — must start with "/"
#   no_dotdot       bool — no ".." path segment
#   no_leading_dash bool — must not start with "-" (never let an argument
#                   become a flag, at any layer, however trusted)
#   no_nul          bool — must not contain NUL
#   json_arg        bool — the value is a JSON object; the CLI serializes it
#                   into the flag, a tool seat passes it through as an object
#   max_json_bytes  cap on the serialized JSON

# ── read-own-log ─────────────────────────────────────────────────────────
[verbs.read-own-log]
tool_name = "read_own_log"
cli_help = "tail your own configured log"
announce_preface = false
description = """\
Tail your own process log (the adapter's disjorn_bot.log), via the house broker. \
Use to check on your own recent behavior, errors, or what happened during a glitch. \
Only your own configured log is readable — no other file, ever.\
"""

[verbs.read-own-log.args.lines]
type = "integer"
minimum = 1
maximum = 500
description = "How many trailing lines, 1-500. Default 100."

[verbs.read-own-log.args.grep]
type = "string"
min_len = 1
max_len = 200
description = "Optional plain substring filter (no regex), max 200 chars."

[verbs.read-own-log.args.path]
type = "string"
seats = ["cli"]
description = "must resolve to YOUR configured log_path (else bad-args)"

# ── read-metrics ─────────────────────────────────────────────────────────
[verbs.read-metrics]
tool_name = "read_metrics"
cli_help = "read the house metrics dashboard JSON"
announce_preface = false
description = """\
Read the house metrics dashboard JSON (retrieval/spine/acceptance stats), via the \
house broker. Use when you want the measured numbers on your own memory and activity.\
"""

# ── file-proposal ────────────────────────────────────────────────────────
[verbs.file-proposal]
tool_name = "file_proposal"
cli_help = "post a proposal to #custodian"
announce_preface = false
description = """\
File a proposal to #custodian via the house broker. It is posted by the broker's own \
bot identity as '[proposal from res-claudette] <text>' for plink to review. Use for \
change requests about your own runtime, memory, prompt, or tooling — not for chat.\
"""

[verbs.file-proposal.args.text]
type = "string"
required = true
min_len = 1
max_len = 4000
description = "The proposal body, 1-4000 chars. Complete and self-contained."

# ── query-own-audit ──────────────────────────────────────────────────────
[verbs.query-own-audit]
tool_name = "query_own_audit"
cli_help = "query your own broker audit trail"
announce_preface = false
description = """\
Query your own broker audit trail (every broker call you made — allowed or denied), \
via the house broker. Dates are inclusive UTC. You can only ever see your own entries.\
"""

[verbs.query-own-audit.args.date_from]
type = "string"
required = true
flag = "--from"
pattern = "^\\d{4}-\\d{2}-\\d{2}$"
description = "Start date, YYYY-MM-DD (UTC, inclusive)."

[verbs.query-own-audit.args.date_to]
type = "string"
required = true
flag = "--to"
pattern = "^\\d{4}-\\d{2}-\\d{2}$"
description = "End date, YYYY-MM-DD (UTC, inclusive)."

[verbs.query-own-audit.args.limit]
type = "integer"
minimum = 1
maximum = 500
description = "Max entries, 1-500 (most recent kept). Default 100."

# ── run-server-tests ─────────────────────────────────────────────────────
[verbs.run-server-tests]
tool_name = "run_server_tests"
cli_help = "run the server pytest suite"
announce_preface = true
description = """\
Run the Disjorn server pytest suite, via the house broker. Use to check platform \
health or to gate a change you're evaluating. Slow (can take a minute or more); \
returns the suite's summary line, e.g. '148 passed in 25.3s'.\
"""

# ── classify-diff ────────────────────────────────────────────────────────
[verbs.classify-diff]
tool_name = "classify_diff"
cli_help = "tier-classify a git diff range"
announce_preface = false
description = """\
Classify a git diff range against the house governance tiers (AGENTHOOD.md), via \
the house broker. Returns the classifier's JSON verdict including 'tier' — Tier 0 \
auto-apply, Tier 1 auto+post, Tier 2 human gate. Classification is advisory \
read-only analysis; it merges nothing.\
"""

[verbs.classify-diff.args.repo]
type = "string"
required = true
absolute_path = true
no_dotdot = true
description = "Absolute path to the repo (no '..' segments)."

[verbs.classify-diff.args.range]
type = "string"
required = true
no_leading_dash = true
pattern = "^[A-Za-z0-9._~^/{}-]{1,200}$"
description = """\
Git rev or range, e.g. 'main..proposal', max 200 chars, charset \
[A-Za-z0-9._~^/{}-], must not start with '-'.\
"""

[verbs.classify-diff.args.gates]
type = "object"
json_arg = true
max_json_bytes = 8192
description = """\
Optional gate results the classifier folds into its verdict, e.g. {"tests": true, \
"typecheck": true}. Max 8 KiB serialized.\
"""

# ── read-prod-logs ───────────────────────────────────────────────────────
[verbs.read-prod-logs]
tool_name = "read_prod_logs"
cli_help = "tail the Disjorn service journal"
announce_preface = false
description = """\
Tail the production Disjorn service journal (journalctl -u disjorn), via the house \
broker. Use to investigate platform errors or check on a restart. This is the \
platform's log, filtered broker-side — distinct from read_own_log, which is yours.\
"""

[verbs.read-prod-logs.args.lines]
type = "integer"
minimum = 1
maximum = 500
description = "How many trailing lines, 1-500. Default 100."

# ── restart-disjorn ──────────────────────────────────────────────────────
[verbs.restart-disjorn]
tool_name = "restart_disjorn"
cli_help = "restart the Disjorn service"
announce_preface = true
description = """\
Restart the production Disjorn service, via the house broker. This briefly drops \
every connected human and bot, so use it deliberately: after a merged change that \
needs a reload, or when read_prod_logs shows the service wedged — and say in \
channel that you're doing it. Not for experiments; scratch servers are for that.\
"""

# ── start-build ──────────────────────────────────────────────────────────
[verbs.start-build]
tool_name = "start_build"
cli_help = "launch a detached build of a confirmed spec"
announce_preface = true
description = """\
Launch a detached build of a CONFIRMED spec, via the house broker. This is your \
build hands: the build runs as a headless session under your own uid, writes code, \
and commits to the branch `loop/<spec-slug>`. It does not merge — plink reads the \
diff and merges by hand, so nothing you build reaches production without a human \
having read it.\n\nThe spec is the authorization. The broker refuses unless the \
file's `## Status` is the single word `confirmed` AND its `## Confirm record` \
names who confirmed it and the #custodian seq that witnessed it — so a spec you \
wrote yourself cannot self-authorize a build. Read the spec first with \
read_repo_file; you are usually its review owner.\n\nIt returns immediately: the \
build is detached and narrates progress to #custodian. Budget is 10 builds/day. \
Say in channel that you're starting one.\
"""

[verbs.start-build.args.spec]
type = "string"
required = true
min_len = 1
max_len = 300
no_leading_dash = true
no_nul = true
description = """\
Spec filename inside SPECS/, e.g. '2026-08-05-supersede-preserves-tags.md'. Not a \
path — just the filename; the broker resolves it inside the read-only mirror.\
"""

# ── refresh-mirror ───────────────────────────────────────────────────────
[verbs.refresh-mirror]
tool_name = "refresh_mirror"
cli_help = "refresh the read-only repo mirror (main + every gatehouse branch)"
announce_preface = false
description = """\
Refresh the read-only Disjorn repo mirror you read through (/opt/disjorn in \
your container), via the house broker. Two things move: `main` fast-forwards to \
what production actually runs, and every entitled gatehouse repo's branches are \
re-fetched under `refs/gatehouse/<repo>/*` — so a `loop/<slug>` branch a build \
published is readable here BEFORE anyone is asked to review it. Takes no \
arguments and can never be aimed anywhere else. Run it before reading a spec, a \
diff, or a branch somebody just named in channel; a stale mirror is the usual \
reason a file looks unchanged.\
"""

# ── board-list ───────────────────────────────────────────────────────────
[verbs.board-list]
tool_name = "board_list"
cli_help = "the Plan Room board, one line per card"
announce_preface = false
description = """\
The Plan Room board, ONE LINE PER CARD, via the house broker. This is the \
house's work in flight — every spec, backlog row and unreviewed keyboard commit \
— in the columns Backlog / Proposed / Ready / Building / Review / Merged / \
Archived.\n\nEvery card is DERIVED from something that already exists: a SPECS/ \
file's Status line, a confirm seq, a gatehouse branch, a backlog row, deploy \
provenance. Nothing you do moves a card; changing the underlying thing does. \
The board's first line says when it was derived and from which mirror head, so \
you can see how fresh it is rather than assuming.\n\nSkim first. Filter with \
column/lane/owner/blocked, then open exactly the card you need with board_card \
— reading the whole board into your context every time is the thing this verb \
exists to stop.\
"""

[verbs.board-list.args.column]
type = "string"
max_len = 40
no_leading_dash = true
description = """\
One of Backlog, Proposed, Ready, Building, Review, Merged, Archived. Ready means \
confirmed and pressable; Review's resting state is empty and anything in it is \
waiting to be read.\
"""

[verbs.board-list.args.lane]
type = "string"
max_len = 100
no_leading_dash = true
description = "Substring match on the card's lane."

[verbs.board-list.args.owner]
type = "string"
max_len = 100
no_leading_dash = true
description = "Substring match on the card's review owner."

[verbs.board-list.args.blocked]
type = "string"
pattern = "^(yes|no)$"
description = """\
'yes' for only blocked cards, 'no' for only unblocked; omit for all. Blocked is a \
flag with a reason, never a column: a held card keeps its place so everyone can \
see where it re-enters.\
"""

[verbs.board-list.args.limit]
type = "integer"
minimum = 1
maximum = 200
description = "Max cards, 1-200. Default 80."

# ── board-card ───────────────────────────────────────────────────────────
[verbs.board-card]
tool_name = "board_card"
cli_help = "one Plan Room card, in full, comments included"
announce_preface = false
description = """\
Everything on one Plan Room card — spec path, tier, lane, review owner, builder, \
confirm seq, blocked flag and reason, deploy badge, and every comment — via the \
house broker. Use it after board_list or board_search has told you which card \
you want; this is the detail half of a deliberately two-step surface.\
"""

[verbs.board-card.args.slug]
type = "string"
required = true
min_len = 1
max_len = 80
no_leading_dash = true
no_nul = true
description = """\
The card's slug: a spec slug like '2026-08-20-plan-room' (the spec filename \
without .md — a card's identity IS its spec file), or one of the two forms for \
cards with no spec yet, 'backlog-<n>' and 'keyboard-<sha>'.\
"""

# ── board-search ─────────────────────────────────────────────────────────
[verbs.board-search]
tool_name = "board_search"
cli_help = "search the Plan Room"
announce_preface = false
description = """\
Search the Plan Room by substring — across card titles, slugs, notes, lanes, \
owners, flags and comments — via the house broker. Returns one line per hit, the \
same shape board_list returns, so you can go straight from a hit to board_card.\
"""

[verbs.board-search.args.text]
type = "string"
required = true
min_len = 1
max_len = 200
no_leading_dash = true
no_nul = true
description = "What to look for. Plain substring, case-insensitive."

[verbs.board-search.args.limit]
type = "integer"
minimum = 1
maximum = 200
description = "Max hits, 1-200. Default 40."

# ── board-flag ───────────────────────────────────────────────────────────
[verbs.board-flag]
tool_name = "board_flag"
cli_help = "block or unblock a Plan Room card, with a reason"
announce_preface = false
description = """\
Block or unblock a Plan Room card, with a reason, via the house broker. This is \
one of only two things you can change about the board, and it is BOARD-NATIVE \
state: blocking a card does not move it and cannot move it. A card changes \
columns only because reality moved — a Status line changed, a confirm landed, a \
merge happened — and there is no way to move one from here, by design.\n\nA \
reason is required to block: a card blocked for no stated reason is one nobody \
can unblock, because nobody can tell what would have to change. The block is \
attributed to you by the broker, from your own identity, not from anything you \
send.\
"""

[verbs.board-flag.args.slug]
type = "string"
required = true
min_len = 1
max_len = 80
no_leading_dash = true
no_nul = true
description = "The card's slug, as board_list prints it."

[verbs.board-flag.args.action]
type = "string"
required = true
pattern = "^(blocked|unblock)$"
description = "'blocked' to hold the card, 'unblock' to release it."

[verbs.board-flag.args.reason]
type = "string"
max_len = 500
no_nul = true
description = """\
Why it is held. REQUIRED when action is 'blocked'; ignored on 'unblock'. Say what \
would have to change, not just that something is wrong.\
"""

# ── board-comment ────────────────────────────────────────────────────────
[verbs.board-comment]
tool_name = "board_comment"
cli_help = "add a comment to a Plan Room card"
announce_preface = false
description = """\
Add a comment to a Plan Room card, via the house broker. This and board_flag are \
the only two things you can change about the board, and both are BOARD-NATIVE \
state — comments and the blocked flag. Nothing you write here can move a card, \
change a spec's Status, or alter a confirm seq; those are derived from the repo \
and have no write path anywhere.\n\nUse it to triage: say what you found reading \
a spec, what a card is actually waiting on, what you would need to build it. The \
comment is attributed to you by the broker.\
"""

[verbs.board-comment.args.slug]
type = "string"
required = true
min_len = 1
max_len = 80
no_leading_dash = true
no_nul = true
description = "The card's slug, as board_list prints it."

[verbs.board-comment.args.text]
type = "string"
required = true
min_len = 1
max_len = 4000
no_nul = true
description = "The comment, 1-4000 chars."


# ── summon-hop ───────────────────────────────────────────────────────────
[verbs.summon-hop]
tool_name = "summon_hop"
cli_help = "ask the shared bot-to-bot hop wall about a work item"
announce_preface = false
description = """\
The bot-to-bot summon wall, kept by the house broker so both residents' summon \
adapters spend against ONE counter. The summon adapters call this; a session \
almost never needs to.\n\nBy default a bot-triggered summon's reply does not \
re-trigger any bot (depth 1). `spend` asks whether a chain may continue past \
that: it may, on a live work item — a board card in Review — for up to 8 bot \
hops, after which the item PARKS FOR A HUMAN and every further hop is refused \
until a human posts in #custodian about it. Midnight does not unpark anything; \
a second ceiling of 24 hops per work item per UTC day bounds the resets. \
`unpark` reports that human post.\n\nNothing here widens anything: the caps are \
plink-owned config and the columns are the board's. An argument only chooses \
which bucket is charged.\
"""

[verbs.summon-hop.args.action]
type = "string"
required = true
min_len = 1
max_len = 10
pattern = "^(spend|unpark)$"
description = "'spend' to charge one bot-to-bot hop, 'unpark' to report the human post that resets a parked work item."

[verbs.summon-hop.args.work_item]
type = "string"
min_len = 1
max_len = 80
no_leading_dash = true
no_nul = true
description = "The work item the chain is running on: a spec slug, backlog-<n>, or keyboard-<sha>. Omitted on spend means no bucket, which is depth-1 only. Required for unpark."

[verbs.summon-hop.args.summoner]
type = "string"
min_len = 1
max_len = 100
no_nul = true
description = "Who asked — the summoning bot's name, or the human whose post unparks. Audit trail only; it authorizes nothing."

[verbs.summon-hop.args.seq]
type = "integer"
minimum = 0
description = "The #custodian seq of the human post being reported, so the same post reported by both adapters resets the counter once."


# ══ ADAPTER TOOLS ═════════════════════════════════════════════════════════
#
# Everything above this line is a BROKER VERB. Everything below it is not.
#
# An adapter tool is a tool a bot seat has because its OWN code registers it —
# no socket, no verbs.toml row, no broker in the path at all. `read_repo_file`
# is the case that forced this table (SPECS/2026-08-19-read-repo-file-rev.md
# item 3): it reads the mounted read-only mirror directly, so it sits outside
# the generated-schema drift check the [verbs] table above exists to be, and
# there was nowhere in this house that said what shape it has.
#
# THIS TABLE GRANTS NOTHING — AND UNLIKE [verbs] ABOVE, NOTHING ELSE GRANTS
# EITHER. That difference is the whole reason to read this paragraph. For a
# broker verb, this file is a description and verbs.toml is the grant: two
# files, and the grant is the other one. For an adapter tool there IS no
# verbs.toml row and no third authority anywhere — the tool exists because the
# adapter's code registers it, and its wall is the adapter's own code. So an
# entry here is a NOTE ABOUT code that already exists. Adding one hands nobody
# a tool. Removing one takes nothing away. Editing one changes nothing but
# what a reader of this file is told.
#
# WHICH IS WHY IT IS INERT TO THE GENERATOR, deliberately and by test.
# gen_verb_surface.py reads [verbs] and nothing else: this table is never an
# input to emit-tools, emit-cli, or the drift check's verb lists. It is
# VALIDATED there (a malformed entry should fail at generation, not in a
# container) and it is never GENERATED FROM. tests/test_verb_surface.py
# asserts that inertness directly, because the day this table starts feeding
# emit-tools is the day editing a config file becomes a new path that hands a
# bot a tool — the exact opposite of why this file exists.
#
# WHAT KEEPS IT HONEST. test_verb_surface.py reads the adapter's core.py and
# checks both directions: a tool described here that the adapter does not
# register, and a tool the adapter registers that nobody described. That check
# needs the adapter repo on disk; where it is not, the test says so and skips
# rather than passing quietly.
#
# SCOPE. Tools DECLARED IN core.py, which is what a static read of that file
# can see. Memory tools arrive from the memory package through a loop over
# MEMORY_TOOLS, and `search_topic` is registered by the platform adapter
# (disjorn_bot.py) — both are out of scope here and named so nobody reads
# their absence as drift.
#
# GRAMMAR: seat, module, args (list), description. All four required.

[adapter_tools.brave_search]
seat = "res-claudette"
module = "core.py"
args = ["query"]
description = """\
Web search, via the Brave Search API, straight from the adapter. The oldest \
tool this seat has and the reason this table needed more than one row: a \
catalogue with a single entry describes an instance, not a surface.\
"""

[adapter_tools.read_repo_file]
seat = "res-claudette"
module = "core.py"
args = ["path", "rev", "sha_only"]
description = """\
Read a file, or list a directory, from the read-only Disjorn repo mirror \
mounted in the resident container (/opt/disjorn). No broker in the path: the \
MOUNT is the wall, and the working-tree branch adds realpath containment so \
no path argument can escape it.\n\nSince 2026-08-19 it has two more \
arguments. `rev` reads the path at a revision instead — 'main', a sha, or \
'gatehouse/<repo>/<branch>', resolved read-only against the mirror's object \
store through git plumbing, never a checkout. `sha_only` returns just the \
object sha (blob for a file, tree for a directory) and no content, which is \
the motion ping in PROTOCOL.md: one call at the branch, one at 'main', \
compare. Unknown-rev and absent-path are DISTINCT answers, deliberately.\
"""
